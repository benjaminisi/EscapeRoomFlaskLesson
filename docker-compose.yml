services:
  db:
    image: mysql:8.0
    container_name: escaperoom-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: escaperoom
      MYSQL_USER: escaperoom
      MYSQL_PASSWORD: escaperoom_pass
      MYSQL_ROOT_PASSWORD: root_escaperoom
    ports:
      # Expose to host for teaching access (MySQL Workbench, DBeaver, CLI)
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "escaperoom", "-pescaperoom_pass"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  escaperoom:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escaperoom-lab
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "5001:5001"
    volumes:
      # Mount host repository into container for instant hot-reloading
      - .:/app
      # Preserve container-compiled node_modules
      - /app/frontend/node_modules
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_DEBUG=1
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=escaperoom
      - DB_PASSWORD=escaperoom_pass
      - DB_NAME=escaperoom
    restart: unless-stopped

volumes:
  mysql_data:

